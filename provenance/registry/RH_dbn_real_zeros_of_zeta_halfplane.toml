text = "Operator read-back. For any real theta: if the Riemann zeta function has no zero whose real part exceeds theta, then for every real t at least 2(theta - 1/2)^2 and every complex z with H_t(z) = 0, the imaginary part of z is zero. Conditional on the half-plane hypothesis; not RH."
